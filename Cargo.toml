[package]
name = "db-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Local MCP server for Oracle, PostgreSQL, MySQL and SQLite"
license = "MIT"
repository = "https://github.com/arthurhoch/db-mcp"
readme = "README.md"

[dependencies]
base64 = "0.23"
bigdecimal = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
oracledb = "=26.0.0-beta.5"
percent-encoding = "2"
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.63", features = ["visitor"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql", "sqlite", "chrono", "json", "bigdecimal", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "signal", "sync", "time", "process"] }
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
