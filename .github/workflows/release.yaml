name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release (vX.Y.Z).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Verify version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(cargo metadata --no-deps --locked --format-version=1 | jq -r '.packages[0].version')"
          test "$TAG" = "v$version"
          test "$(git describe --tags --exact-match)" = "$TAG"
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yaml
    with:
      ref: ${{ needs.version.outputs.tag }}

  security:
    needs: version
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yaml

  publish:
    name: Publish release
    needs: [version, build, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: db-mcp-*
          path: dist
          merge-multiple: true
      - name: Verify package set and create checksums
        working-directory: dist
        run: |
          for platform in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            test -s "db-mcp-$platform.tar.gz"
          done
          for platform in windows-x64 windows-arm64; do
            test -s "db-mcp-$platform.zip"
          done
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish all packages together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --verify-tag --generate-notes --title "DB MCP $TAG" --latest
