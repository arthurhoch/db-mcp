services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dbmcp_test
      POSTGRES_PASSWORD: disposable-test-password
      POSTGRES_DB: dbmcp_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmcp_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: disposable-root-password
      MYSQL_DATABASE: dbmcp_test
      MYSQL_USER: dbmcp_test
      MYSQL_PASSWORD: disposable-test-password
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 2s
      retries: 60
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: DisposableRoot123
      APP_USER: dbmcp_test
      APP_USER_PASSWORD: DisposableTest123
    ports: ["127.0.0.1:51521:1521"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60
